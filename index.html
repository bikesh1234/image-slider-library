<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal Image Slider</title>
  <link rel="stylesheet" href="style.css">
  <script src="slider.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Nepal Image Gallery</h1>
    <p>Explore beautiful places in Nepal.</p>

    <section class="slider" aria-label="Nepal image slider">
      <img id="slide-image" src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?auto=format&fit=crop&w=1200&q=85" alt="Himalayan mountains in Nepal">
      <button id="prev" class="arrow" type="button" aria-label="Previous image">&#8592;</button>
      <button id="next" class="arrow" type="button" aria-label="Next image">&#8594;</button>
    </section>

    <h2 id="caption">Himalayan Views</h2>
    <div id="dots" class="dots" aria-label="Choose an image"></div>
  </main>
</body>
</html>
